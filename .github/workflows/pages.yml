name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Before setup-node, so that its pnpm cache has a pnpm to find.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # The tests that need disk images skip themselves when there are
      # none, and there are none here: no game data goes near this repo.
      - run: pnpm test
      - run: pnpm run build
      # enablement asks for the Pages site to be created if there is not
      # one. Worth keeping for anyone forking this, but do not rely on
      # it: GitHub would not let the workflow's own token create the
      # site here ("Resource not accessible by integration"), so this
      # repository's was made through the API instead. Once a site
      # exists the step just reads it and this is inert.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
